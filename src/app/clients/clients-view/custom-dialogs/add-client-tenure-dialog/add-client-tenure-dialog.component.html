<h1 mat-dialog-title>{{ 'labels.buttons.UpdateTenure' | translate }}</h1>
<div mat-dialog-content>
  <form [formGroup]="tenureForm">
    <mat-form-field>
      <mat-label>{{ 'labels.inputs.Tenure' | translate }}</mat-label>
      <input matInput type="number" formControlName="tenure" min="0" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'labels.inputs.RecalculationReason' | translate }}</mat-label>
      <input matInput formControlName="recalculationReason" maxlength="50" />
      <mat-hint align="end">{{ tenureForm.get('recalculationReason')?.value?.length || 0 }}/50</mat-hint>
    </mat-form-field>
  </form>
</div>
<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close>{{ 'labels.buttons.Cancel' | translate }}</button>
  <button mat-raised-button color="primary" [disabled]="tenureForm?.invalid" (click)="submit()">
    {{ 'labels.buttons.Confirm' | translate }}
  </button>
</mat-dialog-actions>
