<div class="container m-b-20" fxLayout="row" fxLayoutAlign="end" fxLayoutGap="20px">
  <button
    mat-raised-button
    color="primary"
    [routerLink]="['create']"
    *mifosxHasPermission="'CREATE_LOANPAYMENTALLOCATIONSETTING'"
  >
    <fa-icon icon="plus"></fa-icon>&nbsp;&nbsp;
    {{ 'labels.buttons.Create' | translate }}
  </button>
</div>

<div class="container">
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">
      <caption class="display-none">
        {{
          'labels.oaf.Loan product allocation setting' | translate
        }}
      </caption>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ 'labels.oaf.Country' | translate }}</th>
        <td mat-cell *matCellDef="let loanProduct">{{ loanProduct.name }}</td>
      </ng-container>

      <ng-container matColumnDef="ou">
        <th mat-header-cell *matHeaderCellDef>{{ 'labels.oaf.Office' | translate }}</th>
        <td mat-cell *matCellDef="let loanProduct">{{ loanProduct.ou }}</td>
      </ng-container>

      <ng-container matColumnDef="repaymentChoice">
        <th mat-header-cell *matHeaderCellDef>{{ 'labels.oaf.Options' | translate }}</th>
        <td mat-cell *matCellDef="let loanProduct">{{ loanProduct.repaymentChoice }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>{{ 'labels.heading.Actions' | translate }}</th>
        <td mat-cell *matCellDef="let loanProduct" [routerLink]="['edit', loanProduct.id]">
          <button type="button" mat-raised-button color="primary">
            <fa-icon icon="edit"></fa-icon>&nbsp;&nbsp;{{ 'labels.buttons.Edit' | translate }}
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="select-row"></tr>
    </table>

    <mat-paginator
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
